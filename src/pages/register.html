<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 03 - Registro</title>
    <link rel="icon" href="../images/favicon_io/favicon.ico">
    <!-- Google Icons & Fonvicon.its -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>
    <header class="header-content">
        <nav class="nav-header">
            <ul class="nav-list" id="nav-list">
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <h1>Datos del estudiante</h1>

        <!-- INPUT DEL NOMBRE -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">


        <!-- INPUT DEL APELLIDO -->
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido">


        <!-- INPUT DE LA LIBRETA UNIVERSITARIA -->
        <label for="libreta">Libreta Universitaria:</label>
        <input type="text" id="libreta">


        <!-- BOTÓN -->
        <button id="mostrarDatos">Mostrar datos</button>


        <!-- TABLA -->
        <table >
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Libreta Universitaria</th>
                </tr>
            </thead>
            <tbody id="tablaDatos">
            </tbody>
        </table>
    </main>

    <script type="module" src="../js/header.js"></script>
    <!-- Conexión con tu script del ejercicio 01 -->
    <script type="module" src="../js/ejercicio01.js"></script>
    
</body>
</html>
