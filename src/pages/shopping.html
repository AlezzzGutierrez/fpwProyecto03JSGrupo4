<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 03</title>
    <link rel="icon" href="../images/favicon_io/favicon.ico">
    <!-- Google Icons & Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/shopping.css">
</head>

<body>
    <header class="header-content">
        <nav class="nav-header">
            <ul class="nav-list" id="nav-list">
            </ul>
        </nav>
    </header>

    <main class="main-content">

        <!-- BOTONES DE ACCIÓN -->
        <div class="actions-container">
            <button class="btn-action" id="btn-show-all">
                <span class="material-symbols-outlined">grid_view</span>
                Productos
            </button>
            <button class="btn-action" id="btn-filter-stock">
                <span class="material-symbols-outlined">filter_alt</span>
                En stock
            </button>
            <button class="btn-action" id="btn-buy-stock">
                <span class="material-symbols-outlined">shopping_cart_checkout</span>
                ¡Quiero el combo!
            </button>
            <button class="btn-action" id="btn-calc-total">
                <span class="material-symbols-outlined">calculate</span>
                Total a pagar
            </button>
        </div>

        <!-- DETALLE Y TOTAL -->
        <div class="summary-container">
            <p id="detalle" class="summary-detalle"></p>
            <p id="total" class="summary-total"></p>
        </div>

        <!-- PRODUCTOS -->
        <ul id="product-list" class="product-list"></ul>
    </main>

    <script src="../js/headerPages.js"></script>
    <script type="module" src="../js/shopping.js"></script>
    <script src="../js/shoppingService.js"></script>
</body>

</html>
